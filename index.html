<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070b"><link rel="manifest" href="manifest.webmanifest"><title>JARVIS</title><style>
:root{--c:#42d9ff;--bg:#05070b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#eafaff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}
#orb{position:fixed;right:16px;top:18px;width:52px;height:52px;border-radius:50%;z-index:9;display:grid;place-items:center;background:#07131a;border:1px solid #42d9ff55;box-shadow:0 0 18px #197cff66;cursor:pointer}
#orb:before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c),0 0 26px var(--c)}#orb.listening{animation:pulse 1s infinite}.listening:before{background:white!important;box-shadow:0 0 18px white,0 0 35px var(--c)!important}.thinking:before{background:#b86cff!important;box-shadow:0 0 18px #b86cff!important}.speaking:before{background:#ff9f3d!important;box-shadow:0 0 18px #ff9f3d!important}
@keyframes pulse{50%{transform:scale(1.08)}}#panel{position:fixed;right:14px;top:80px;width:min(360px,calc(100vw - 28px));max-height:70vh;background:#071018ee;border:1px solid #214150;border-radius:22px;padding:18px;backdrop-filter:blur(18px);display:none;z-index:8;box-shadow:0 20px 60px #000b}.open{display:block!important}.title{letter-spacing:.2em;font-weight:700}.state{color:#8da9b7;font-size:13px;margin-top:6px}.chat{margin-top:14px;max-height:45vh;overflow:auto;display:flex;flex-direction:column;gap:9px}.m{padding:10px 12px;border-radius:13px;font-size:14px;white-space:pre-wrap}.j{background:#0c1b24}.u{background:#12344a;align-self:flex-end}.controls{display:flex;gap:8px;margin-top:14px}.controls button{border:0;border-radius:13px;padding:12px;font-weight:700}.talk{flex:1;background:#dff8ff}.close{background:#1c2930;color:white}</style></head><body>
<div id="orb"></div><section id="panel"><div class="title">J A R V I S</div><div id="state" class="state">READY • TAP THE CORE TO SPEAK</div><div id="chat" class="chat"><div class="m j">JARVIS online.</div></div><div class="controls"><button class="talk" id="talk">🎙️ Talk</button><button class="close" id="close">Close</button></div></section><script src="app.js"></script></body></html>
